services:
  mysql:
    image: mysql:8.4
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: market_user
      MYSQL_PASSWORD: market_pass
    ports:
      - "3306:3306"
    volumes:
      - marketplace_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - marketplace-net
  eureka:
    build:
      context: ../marketplace-eureka
    container_name: marketplace-eureka
    ports:
      - "8761:8761"
    networks:
      - marketplace-net
    restart: unless-stopped
  auth:
    environment:
        DB_HOST: mysql
        DB_PORT: 3306
        DB_NAME: auth_db
        DB_USER: market_user
        DB_PASSWORD: market_pass
        EUREKA_HOST: eureka
        EUREKA_PORT: 8761
        JWT_SECRET: a9D2fG7hJ4kL1mN6pQ3rS8tU5vW0xY2z
        DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    build:
      context: ../marketplace-auth
    container_name: marketplace-auth
    ports:
      - "8081:8081"
    networks:
      - marketplace-net
    restart: unless-stopped
  steam-auth-proxy:
    image: ghcr.io/niekcandaele/steam-auth-proxy:latest
    container_name: marketplace-steam-proxy
    ports:
      - "19000:19000"
    environment:
      STEAM_API_KEY: "EB81C231FD4E68787E03F4964BCA80C1"
      BASE_URL: "http://localhost:19000"
      ALLOWED_REDIRECT_URIS: "http://localhost:8081/login/oauth2/code/steam"
      OIDC_CLIENT_SECRET: "5fdFDF0sd09dd99ssfs09FGS"
    networks:
      - marketplace-net
    restart: unless-stopped
  wallet:
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: wallet_db
      DB_USER: market_user
      DB_PASSWORD: market_pass
      EUREKA_HOST: eureka
      EUREKA_PORT: 8761
      DDL_AUTO: update
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    build:
      context: ../marketplace-wallet
    container_name: marketplace-wallet
    ports:
      - "6767:6767"
    networks:
      - marketplace-net
    restart: unless-stopped
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: marketplace-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - marketplace-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: marketplace-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - marketplace-net

volumes:
  marketplace_mysql_data:

networks:
  marketplace-net:
    driver: bridge