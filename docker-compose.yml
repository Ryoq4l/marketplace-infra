services:
  mysql:
    image: mysql:8.4
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: market_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - marketplace_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - marketplace-net
  eureka:
    build:
      context: ../marketplace-eureka
    container_name: marketplace-eureka
    ports:
      - "8761:8761"
    networks:
      - marketplace-net
    restart: unless-stopped
  auth:
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: auth_db
      DB_USER: market_user
      EUREKA_HOST: eureka
      EUREKA_PORT: 8761
      DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    build:
      context: ..
      dockerfile: marketplace-auth/Dockerfile
    container_name: marketplace-auth
    ports:
      - "8081:8081"
    networks:
      - marketplace-net
    restart: unless-stopped
  steam-auth-proxy:
    image: ghcr.io/niekcandaele/steam-auth-proxy:latest
    container_name: marketplace-steam-proxy
    ports:
      - "19000:19000"
    environment:
      STEAM_API_KEY: ${STEAM_API_KEY}
      BASE_URL: "http://localhost:19000"
      ALLOWED_REDIRECT_URIS: "http://localhost:8080/login/oauth2/code/steam,http://localhost:8080/callback?client_name=OidcClient"
      OIDC_CLIENT_SECRET: ${STEAM_CLIENT_SECRET}
    networks:
      - marketplace-net
    restart: unless-stopped
  wallet:
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: wallet_db
      DB_USER: market_user
      EUREKA_HOST: eureka
      EUREKA_PORT: 8761
      DDL_AUTO: update
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    build:
      context: ..
      dockerfile: marketplace-wallet/Dockerfile
    container_name: marketplace-wallet
    ports:
      - "6767:6767"
    networks:
      - marketplace-net
    restart: unless-stopped
  catalog:
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: catalog_db
      DB_USER: market_user
      EUREKA_HOST: eureka
      EUREKA_PORT: 8761
      DDL_AUTO: update
      STEAM_API_KEY: ${STEAM_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    build:
      context: ..
      dockerfile: marketplace-catalog/Dockerfile
    container_name: marketplace-catalog
    ports:
      - "8083:8083"
    networks:
      - marketplace-net
    restart: unless-stopped
  gateway:
    build:
      context: ../marketplace-gateway
      dockerfile: Dockerfile
    container_name: marketplace-gateway
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_HOST: eureka
      EUREKA_PORT: 8761
    ports:
      - "8080:8080"
    depends_on:
      - eureka
    networks:
      - marketplace-net
  order:
    build:
      context: ..
      dockerfile: marketplace-order/Dockerfile
    container_name: marketplace-order
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: order_db
      DB_USER: market_user
      EUREKA_HOST: eureka
      EUREKA_PORT: 8761
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - eureka
    networks:
      - marketplace-net
volumes:
  marketplace_mysql_data:
networks:
  marketplace-net:
    driver: bridge